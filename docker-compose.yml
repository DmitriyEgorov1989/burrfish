services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burrfish}
      POSTGRES_USER: ${POSTGRES_USER:-burrfish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrator:
    image: burrfish-api:local
    restart: "no"
    command: ["--migrate"]
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-burrfish};Username=${POSTGRES_USER:-burrfish};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: burrfish-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-burrfish};Username=${POSTGRES_USER:-burrfish};Password=${POSTGRES_PASSWORD}
      Instagram__AccountId: ${INSTAGRAM_ACCOUNT_ID}
      Instagram__AppSecret: ${INSTAGRAM_APP_SECRET}
      Instagram__VerifyToken: ${INSTAGRAM_VERIFY_TOKEN}
      Instagram__AccessToken: ${INSTAGRAM_ACCESS_TOKEN}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID}
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
